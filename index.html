<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, interactive-widget=resizes-content" />
    <title>DevCraft | AI-Powered Web Development</title>
    <meta name="description" content="DevCraft: Επαγγελματική κατασκευή ιστοσελίδων στη Θεσσαλονίκη και πιστοποιημένος έλεγχος λογισμικού ISTQB. Δημιουργούμε custom λύσεις που φέρνουν αποτελέσματα.">
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-v2.png" />
    <link rel="icon" type="image/svg+xml" href="/devcraft-logo-icon.svg" />
    <link rel="apple-touch-icon" href="/favicon-v2.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource hints for AI chat backend (loaded on interaction, connection warmed early) -->
    <link rel="dns-prefetch" href="https://rgacmyobploucwvwytpl.supabase.co" />
    <link rel="preconnect" href="https://rgacmyobploucwvwytpl.supabase.co" crossorigin />

    <!-- Preload hero LCP image -->
    <link rel="preload" as="image" type="image/webp" href="/hero-banner-mobile.webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" type="image/webp" href="/hero-banner.webp" media="(min-width: 769px)" />

    <!-- Fonts: swap for fast text rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" /></noscript>

    <!-- Analytics deferred 3s after first interaction or 5s absolute -->
    <script>
      function loadAnalytics() {
        if (window.__analyticsLoaded) return;
        window.__analyticsLoaded = true;
        // Google Analytics
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        var g = document.createElement('script');
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-P5ZGGYZVV5';
        g.async = true;
        document.head.appendChild(g);
        g.onload = function() {
          gtag('js', new Date());
          gtag('config', 'G-P5ZGGYZVV5');
        };
        // Contentsquare
        setTimeout(function() {
          var c = document.createElement('script');
          c.src = 'https://t.contentsquare.net/uxa/48d94652d2367.js';
          document.head.appendChild(c);
        }, 2000);
      }
      // Load analytics on first user interaction OR after 5s
      var events = ['click','scroll','touchstart','keydown'];
      var interactionTimer = setTimeout(loadAnalytics, 5000);
      function onInteraction() {
        clearTimeout(interactionTimer);
        setTimeout(loadAnalytics, 3000);
        events.forEach(function(e) { document.removeEventListener(e, onInteraction); });
      }
      events.forEach(function(e) { document.addEventListener(e, onInteraction, {once: true, passive: true}); });
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Static shell for instant FCP — replaced by React on mount -->
      <div style="min-height:100vh;background:#050505;color:#f5f5f5;font-family:Outfit,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">
        <!-- Static hero background — matches HeroSection so LCP image is in DOM immediately -->
        <div style="position:absolute;inset:0">
          <picture>
            <source media="(max-width: 768px)" srcset="/hero-banner-mobile.webp" type="image/webp" />
            <img src="/hero-banner.webp" alt="" width="1920" height="1080" fetchpriority="high" loading="eager" decoding="sync" style="width:100%;height:100%;object-fit:cover;opacity:0.2" />
          </picture>
        </div>
        <div style="position:absolute;inset:0;background:linear-gradient(to top,#050505,rgba(5,5,5,0.6),transparent)"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(5,5,5,0.8),transparent)"></div>
        <nav style="position:fixed;top:0;left:0;right:0;z-index:50;padding:1rem 1.5rem;background:rgba(5,5,5,0.8);backdrop-filter:blur(12px)">
          <img src="/devcraft-logo.svg" alt="DevCraft" width="120" height="32" style="height:2rem;width:auto" />
        </nav>
        <div style="position:relative;z-index:10;flex:1;display:flex;align-items:center;padding:7rem 1.5rem 2rem">
          <div>
            <div style="font-size:clamp(2.25rem,8vw,9rem);font-weight:900;line-height:0.85;letter-spacing:-0.05em">WE BUILD</div>
            <div style="font-size:clamp(2.25rem,8vw,9rem);font-weight:900;line-height:0.85;letter-spacing:-0.05em;font-style:italic;background:linear-gradient(135deg,hsl(38,100%,55%),hsl(45,100%,60%));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">DIGITAL.</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
