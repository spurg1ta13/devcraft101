<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, interactive-widget=resizes-content" />

    <link rel="preload" as="image" type="image/webp" href="/hero-banner-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero-banner.webp" media="(min-width: 769px)" fetchpriority="high" />
    <!-- Critical font preload -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin.woff2" crossorigin fetchpriority="high" />

    <title>DevCraft | Κατασκευή Ιστοσελίδων Θεσσαλονίκη — Web Development & QA</title>
    <meta name="description" content="Κατασκευή ιστοσελίδων στη Θεσσαλονίκη με τεχνητή νοημοσύνη. Επαγγελματική δημιουργία ιστοσελίδων, σχεδιασμός UI/UX και πιστοποιημένος έλεγχος ποιότητας ISTQB. Πακέτα από €600.">
    <meta name="keywords" content="κατασκευή ιστοσελίδων θεσσαλονίκη, κατασκευή ιστοσελίδων, δημιουργία ιστοσελίδων, web development θεσσαλονίκη, κατασκευή website, σχεδιασμός ιστοσελίδων, ISTQB QA">
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-v2.png" />
    <link rel="icon" type="image/svg+xml" href="/devcraft-logo-icon.svg" />
    <link rel="apple-touch-icon" href="/favicon-v2.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- LLM content discovery -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM guide (English)" />
    <link rel="alternate" type="text/plain" href="/llms-el.txt" title="LLM guide (Greek)" />
    <link rel="alternate" type="text/plain" href="/llms-full.txt" title="LLM full guide (EN+EL)" />

    <!-- DNS prefetch for backend (used after interaction) -->
    <link rel="dns-prefetch" href="https://rgacmyobploucwvwytpl.supabase.co" />

    <!-- Inline critical CSS for instant FCP/LCP — static shell + base theme paints before JS/CSS bundle loads -->
    <style>
      /* Font face — critical for FCP text rendering */
      @font-face{font-family:'Outfit';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/outfit-latin.woff2') format('woff2')}
      @font-face{font-family:'Outfit';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/outfit-latin.woff2') format('woff2')}
      /* Theme variables — prevents flash when CSS bundle loads */
      :root{--background:0 0% 2%;--foreground:0 0% 96%;--primary:38 100% 55%;--primary-foreground:0 0% 2%;--border:0 0% 10%;--muted-foreground:0 0% 50%}
      *,::before,::after{box-sizing:border-box}
      body{margin:0;background:hsl(0 0% 2%);color:hsl(0 0% 96%);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
      img,picture{display:block;max-width:100%}
      /* Critical hero LCP styles — paint <h1> instantly without CSS bundle */
      section[aria-label="Hero"]{position:relative;min-height:85dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:7rem}
      @media(min-width:768px){section[aria-label="Hero"]{height:100dvh;min-height:600px;padding-top:0}}
      section[aria-label="Hero"] > div:first-child{position:absolute;inset:0}
      section[aria-label="Hero"] > div:first-child img{width:100%;height:100%;object-fit:cover;opacity:.2}
      section[aria-label="Hero"] .container{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;margin:0 auto;padding:0 1.25rem;max-width:1280px}
      @media(min-width:640px){section[aria-label="Hero"] .container{padding:0 1.5rem}}
      section[aria-label="Hero"] h1{font-size:clamp(2.25rem,8vw,9rem);font-weight:900;line-height:.85;letter-spacing:-.05em;margin:0}
      section[aria-label="Hero"] h1 .text-gradient,section[aria-label="Hero"] .text-gradient{background:linear-gradient(135deg,hsl(38,100%,55%),hsl(45,100%,60%));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      /* Static shell (pre-React paint) */
      .static-shell{min-height:100vh;background:#050505;color:#f5f5f5;font-family:Outfit,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
      .static-shell__bg{position:absolute;inset:0}
      .static-shell__img{width:100%;height:100%;object-fit:cover;opacity:.2}
      .static-shell__grad-top{position:absolute;inset:0;background:linear-gradient(to top,#050505,rgba(5,5,5,.6),transparent)}
      .static-shell__grad-right{position:absolute;inset:0;background:linear-gradient(to right,rgba(5,5,5,.8),transparent)}
      .static-shell__nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:1rem 1.5rem;background:rgba(5,5,5,.8);backdrop-filter:blur(12px)}
      .static-shell__logo{height:2rem;width:auto}
      .static-shell__content{position:relative;z-index:10;flex:1;display:flex;align-items:center;padding:7rem 1.5rem 2rem}
      .static-shell__title{font-size:clamp(2.25rem,8vw,9rem);font-weight:900;line-height:.85;letter-spacing:-.05em}
      .static-shell__title--accent{font-style:italic;background:linear-gradient(135deg,hsl(38,100%,55%),hsl(45,100%,60%));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      /* Below-fold content visibility — skip rendering until scrolled */
      .cv-auto{content-visibility:auto;contain-intrinsic-size:auto 600px}
    </style>

    <!-- Analytics deferred 3s after first interaction or 5s absolute -->
    <script>

      function loadAnalytics() {
        if (window.__analyticsLoaded) return;
        window.__analyticsLoaded = true;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        var g = document.createElement('script');
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-P5ZGGYZVV5';
        g.async = true;
        document.head.appendChild(g);
        g.onload = function() {
          gtag('js', new Date());
          gtag('config', 'G-P5ZGGYZVV5');
        };
        setTimeout(function() {
          var c = document.createElement('script');
          c.src = 'https://t.contentsquare.net/uxa/48d94652d2367.js';
          document.head.appendChild(c);
        }, 2000);
      }
      var events = ['click','scroll','touchstart','keydown'];
      var interactionTimer = setTimeout(loadAnalytics, 5000);
      function onInteraction() {
        clearTimeout(interactionTimer);
        setTimeout(loadAnalytics, 3000);
        events.forEach(function(e) { document.removeEventListener(e, onInteraction); });
      }
      events.forEach(function(e) { document.addEventListener(e, onInteraction, {once: true, passive: true}); });
    </script>
    <!-- Make the Vite-injected CSS bundle non-render-blocking. Inlined critical CSS already paints the hero/shell. -->
    <script>
      (function () {
        var swap = function () {
          var links = document.querySelectorAll('link[rel="stylesheet"][href*="/assets/index-"]');
          links.forEach(function (l) {
            if (l.dataset.async === '1') return;
            l.dataset.async = '1';
            l.media = 'print';
            l.onload = function () { l.media = 'all'; };
          });
        };
        // Run after Vite injects the <link>, but before paint blocking matters
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', swap);
        }
        // Also observe <head> in case the link is injected after DOMContentLoaded
        new MutationObserver(swap).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="4GobB7hINE4WmB+ZbjDcGQ" async></script>
  </head>

  <body>
    <div id="root">
      <!-- Static shell for instant FCP — replaced by React on mount -->
      <div class="static-shell">
        <!-- Static hero background — matches HeroSection so LCP image is in DOM immediately -->
        <div class="static-shell__bg">
          <picture>
            <source media="(max-width: 768px)" srcset="/hero-banner-mobile.webp" type="image/webp" />
            <img src="/hero-banner.webp" alt="DevCraft web development studio hero banner" width="1920" height="1080" fetchpriority="high" loading="eager" decoding="async" class="static-shell__img" />
          </picture>
        </div>
        <div class="static-shell__grad-top"></div>
        <div class="static-shell__grad-right"></div>
        <nav class="static-shell__nav">
          <img src="/devcraft-logo.svg" alt="DevCraft" width="120" height="32" class="static-shell__logo" />
        </nav>
        <div class="static-shell__content">
          <div>
            <h1 class="static-shell__title" style="margin:0">We don't do</h1>
            <h1 class="static-shell__title static-shell__title--accent" style="margin:0">ordinary.</h1>
            <p class="static-shell__title" style="margin:0;font-size:clamp(1.5rem,5vw,5.5rem);opacity:0.9">We build them 4x faster.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
