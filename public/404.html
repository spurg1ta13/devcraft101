<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | DevCraft</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-v2.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;background:#050505;color:#f5f5f5;overflow:hidden}
    .noise{position:fixed;inset:0;opacity:.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .container{text-align:center;padding:2rem;position:relative;z-index:1;max-width:520px}
    .code{font-size:clamp(6rem,20vw,10rem);font-weight:800;letter-spacing:-.06em;line-height:1;background:linear-gradient(135deg,#f59e0b,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .line{width:64px;height:3px;background:linear-gradient(90deg,#f59e0b,transparent);margin:1.5rem auto;border-radius:2px}
    .title{font-size:1.25rem;font-weight:600;margin-bottom:.75rem;color:#e5e5e5}
    .desc{font-size:.95rem;color:#a3a3a3;line-height:1.6;margin-bottom:2rem}
    .cta{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 2rem;background:linear-gradient(135deg,#f59e0b,#d97706);color:#050505;font-weight:600;font-size:.9rem;border:none;border-radius:9999px;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .cta:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,158,11,.25)}
    .cta svg{width:16px;height:16px}
    .glow{position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
    .glow-1{top:-100px;right:-50px;background:#f59e0b}
    .glow-2{bottom:-100px;left:-50px;background:#d97706}
  </style>
  <script>
    // SPA redirect for client-side routing (runs after 3s if user doesn't click CTA)
    var path=window.location.pathname+window.location.search+window.location.hash;
    setTimeout(function(){window.location.replace('/?redirect='+encodeURIComponent(path))},3000);
  </script>
</head>
<body>
  <div class="noise"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="container">
    <div class="code">404</div>
    <div class="line"></div>
    <h1 class="title">Page Not Found</h1>
    <p class="desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="cta">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
      Back to Home
    </a>
  </div>
</body>
</html>
