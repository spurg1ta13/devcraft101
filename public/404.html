<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
// SPA redirect: convert 404 paths to query param so index.html can handle routing
var path = window.location.pathname + window.location.search + window.location.hash;
window.location.replace('/' + '?redirect=' + encodeURIComponent(path));
</script>
</head>
<body></body>
</html>
